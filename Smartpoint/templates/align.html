{% extends "app/plugins/templates/base.html" %}

{% block content %}
<link rel="stylesheet" href="/plugins/Smartpoint/soft_tools.css">
<script>
  try { window.localStorage.setItem("soft_tools_sidebar_hidden", "1"); } catch (_) {}
  function smartalignHideSidebar() {
    if (document.body) document.body.classList.add("soft-tools-sidebar-hidden");
  }
  smartalignHideSidebar();
  window.setTimeout(smartalignHideSidebar, 0);
  window.setTimeout(smartalignHideSidebar, 500);
</script>
<div id="smartalign-root"
     data-project-id="{{ project_id }}"
     data-task-id="{{ task_id }}"></div>
<script src="/plugins/Smartpoint/smart_align_align.js?v=20260602-model-adjustment-ui"></script>
{% endblock %}
